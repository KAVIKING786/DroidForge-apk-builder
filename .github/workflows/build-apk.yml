name: Universal WebToApp Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'UniversalApp'
      package_id:
        description: 'Package ID'
        required: true
        default: 'com.droidforge.builder'
      source_type:
        description: 'Source Type (url or html)'
        required: true
        default: 'url'
      web_url:
        description: 'Target Website URL (if url mode)'
        required: false
        default: 'https://google.com'
      html_content:
        description: 'Custom HTML Code (if html mode)'
        required: false
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Android SDK Environment
        uses: android-actions/setup-android@v3

      - name: Install Cordova Engine
        run: |
          npm install -g cordova

      - name: Create Cordova Project & Configure
        run: |
          cordova create myApp ${{ github.event.inputs.package_id }} "${{ github.event.inputs.app_name }}"
          cd myApp
          cordova platform add android@12.0.0

          if [ "${{ github.event.inputs.source_type }}" = "html" ] && [ -n "${{ github.event.inputs.html_content }}" ]; then
            printf "%s" "${{ github.event.inputs.html_content }}" > www/index.html
          else
            cat << 'EOF' > www/index.html
            <!DOCTYPE html>
            <html>
            <head>
                <meta http-equiv="refresh" content="0; url=${{ github.event.inputs.web_url }}">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <style>
                    body { background: #0b0f17; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
                </style>
            </head>
            <body>
                <p>Loading application...</p>
            </body>
            </html>
          EOF
          fi

      - name: Build Standalone Real APK
        run: |
          cd myApp
          cordova build android --debug

      - name: Upload Real Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Real-Installable-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/*.apk
