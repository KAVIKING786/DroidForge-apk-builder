name: Ultimate App Engine

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'UniversalApp'
      package_id:
        description: 'Package ID'
        required: true
        default: 'com.universal.app'
      html_content:
        description: 'Custom HTML/JS Code'
        required: true
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: beevelop/cordova:latest

    steps:
      - name: Create Complete Android Project
        run: |
          cordova create myApp ${{ github.event.inputs.package_id }} "${{ github.event.inputs.app_name }}"
          cd myApp
          cordova platform add android
          cordova plugin add cordova-plugin-whitelist
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-media
          cordova plugin add cordova-plugin-camera

          # Inject Hardware Acceleration & Permissions in Config
          sed -i '/<\/widget>/i <preference name="android-hardwareAccelerated" value="true" />' config.xml
          sed -i '/<\/widget>/i <preference name="AllowInlineMediaPlayback" value="true" />' config.xml

          # Decode HTML content safely
          mkdir -p www
          echo "${{ github.event.inputs.html_content }}" | base64 -d > www/index.html

      - name: Build Standalone APK
        run: |
          cd myApp
          cordova build android --debug

      - name: Publish Direct Public Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Direct APK Build"
          files: myApp/platforms/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
