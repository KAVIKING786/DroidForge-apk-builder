<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DroidForge - Ultimate App Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #f8fafc; font-family: sans-serif; }
    .card { background: #161f30; border: 1px solid #233554; border-radius: 12px; }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center justify-center">

  <div class="card p-6 w-full max-w-2xl shadow-2xl">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-sky-400">⚡ DroidForge Ultimate Studio</h1>
      <p class="text-xs text-slate-400 mt-1">Build AI Tools, Music Players, Games & Custom Web APKs</p>
    </div>

    <!-- Ready-to-Use App Templates Selector -->
    <div class="mb-5">
      <label class="block text-xs font-bold text-slate-300 mb-2 uppercase tracking-wider">Select Ready-to-Build App Template</label>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <button onclick="loadTemplate('music')" class="bg-slate-800 hover:bg-sky-600 text-xs py-2 px-3 rounded font-medium transition border border-slate-700">🎵 Music Player</button>
        <button onclick="loadTemplate('game')" class="bg-slate-800 hover:bg-sky-600 text-xs py-2 px-3 rounded font-medium transition border border-slate-700">🎮 Canvas Game</button>
        <button onclick="loadTemplate('ai')" class="bg-slate-800 hover:bg-sky-600 text-xs py-2 px-3 rounded font-medium transition border border-slate-700">🤖 AI Assistant</button>
        <button onclick="loadTemplate('calc')" class="bg-slate-800 hover:bg-sky-600 text-xs py-2 px-3 rounded font-medium transition border border-slate-700">🧮 Tool App</button>
      </div>
    </div>

    <!-- App Details Form -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">App Name</label>
        <input type="text" id="appName" value="MySuperApp" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-sky-500">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Package ID</label>
        <input type="text" id="packageId" value="com.mybrand.app" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-sky-500">
      </div>
    </div>

    <!-- Code Editor Area -->
    <div class="mb-4">
      <div class="flex justify-between items-center mb-1">
        <label class="text-xs font-medium text-slate-300">HTML / JS Application Code</label>
        <span class="text-[10px] text-sky-400">Offline & Hardware Accelerated</span>
      </div>
      <textarea id="htmlInput" rows="7" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs font-mono text-slate-200 focus:outline-none focus:border-sky-500" placeholder="Paste your HTML code here or select a template above..."></textarea>
    </div>

    <!-- GitHub Token Field -->
    <div class="mb-6">
      <label class="block text-xs font-medium text-slate-300 mb-1">GitHub Dispatch Key (Token)</label>
      <input type="password" id="ghToken" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-sky-500" placeholder="Paste your github_pat_... token">
    </div>

    <!-- Build Button -->
    <button id="buildBtn" onclick="startBuild()" class="w-full bg-sky-500 hover:bg-sky-600 text-slate-950 font-bold py-3 rounded-lg text-sm transition">
      🚀 Build Clean Standalone APK
    </button>

    <!-- Progress & Download Section -->
    <div id="progressArea" class="hidden mt-6 bg-slate-900 border border-slate-800 rounded-lg p-4">
      <div class="flex justify-between items-center mb-2">
        <span id="statusLabel" class="text-xs font-semibold text-sky-400">Building Package...</span>
        <span id="percentLabel" class="text-xs font-mono text-slate-300">0% (0s)</span>
      </div>
      <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-4">
        <div id="progressBar" class="bg-sky-500 h-full w-0 transition-all duration-300"></div>
      </div>
      <div id="downloadContainer" class="hidden text-center">
        <a id="downloadLink" href="#" class="inline-block w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition">
          📥 Download APK
        </a>
      </div>
    </div>
  </div>

  <script>
    const REPO_OWNER = 'KAVIKING786';
    const REPO_NAME = 'DroidForge';

    // 1. Ready-Made Templates Library
    const templates = {
      music: `<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif}.card{background:#1e293b;padding:24px;border-radius:16px;text-align:center;width:85%;max-width:320px}button{background:#38bdf8;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;margin-top:15px;cursor:pointer}</style></head><body><div class="card"><h2>Audio Player</h2><p id="t" style="font-size:12px;color:#94a3b8;margin:10px 0">Select MP3</p><input type="file" id="f" accept="audio/*" style="display:none"><button onclick="document.getElementById('f').click()">Choose File</button><button id="p" style="display:none">Play</button><audio id="a"></audio></div><script>var a=document.getElementById('a'),f=document.getElementById('f'),p=document.getElementById('p'),t=document.getElementById('t');f.onchange=function(e){var file=e.target.files[0];if(file){t.innerText=file.name;a.src=URL.createObjectURL(file);a.play();p.style.display='inline-block';p.innerText='Pause'}};p.onclick=function(){if(a.paused){a.play();p.innerText='Pause'}else{a.pause();p.innerText='Play'}}<\/script></body></html>`,
      
      game: `<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"><style>body{margin:0;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;height:100vh}canvas{border:1px solid #38bdf8;background:#111}</style></head><body><canvas id="c" width="300" height="400"></canvas><script>var c=document.getElementById('c'),ctx=c.getContext('2d'),y=200,vy=0;window.ontouchstart=window.onclick=function(){vy=-6};function loop(){vy+=0.3;y+=vy;if(y>380)y=380;if(y<10)y=10;ctx.clearRect(0,0,300,400);ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.arc(60,y,12,0,Math.PI*2);ctx.fill();requestAnimationFrame(loop)}loop()<\/script></body></html>`,
      
      ai: `<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{background:#0b0f19;color:#fff;font-family:sans-serif;padding:16px;margin:0}.box{height:75vh;overflow-y:auto;border:1px solid #334155;border-radius:8px;padding:10px;margin-bottom:10px}input{width:70%;padding:10px;background:#1e293b;border:1px solid #334155;color:#fff;border-radius:6px}button{width:25%;padding:10px;background:#38bdf8;border:none;border-radius:6px;font-weight:bold}</style></head><body><div class="box" id="m"><div><b>AI Bot:</b> Hello! How can I assist you today?</div></div><div style="display:flex;gap:5%"><input id="i" placeholder="Type prompt..."><button onclick="send()">Send</button></div><script>function send(){var i=document.getElementById('i'),m=document.getElementById('m');if(!i.value)return;m.innerHTML+='<div style="margin-top:8px"><b>You:</b> '+i.value+'</div>';var v=i.value;i.value='';setTimeout(function(){m.innerHTML+='<div style="margin-top:8px;color:#38bdf8"><b>AI:</b> Processed result for: '+v+'</div>';m.scrollTop=m.scrollHeight},500)}<\/script></body></html>`,
      
      calc: `<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif}.calc{background:#1e293b;padding:20px;border-radius:12px;width:260px}input{width:100%;padding:12px;box-sizing:border-box;font-size:20px;margin-bottom:12px;background:#0f172a;border:1px solid #334155;color:#fff;border-radius:6px;text-align:right}button{width:22%;height:45px;margin:1%;background:#334155;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}</style></head><body><div class="calc"><input id="d" readonly><div id="b"></div></div><script>var d=document.getElementById('d'),keys=['7','8','9','/','4','5','6','*','1','2','3','-','C','0','=','+'],b=document.getElementById('b');keys.forEach(function(k){var btn=document.createElement('button');btn.innerText=k;btn.onclick=function(){if(k==='C')d.value='';else if(k==='='){try{d.value=eval(d.value)}catch(e){d.value='Error'}}else d.value+=k};b.appendChild(btn)})<\/script></body></html>`
    };

    function loadTemplate(type) {
      document.getElementById('htmlInput').value = templates[type];
      if(type==='music') document.getElementById('appName').value = 'MusicPlayer';
      if(type==='game') document.getElementById('appName').value = 'FlappySpace';
      if(type==='ai') document.getElementById('appName').value = 'AIAssistant';
      if(type==='calc') document.getElementById('appName').value = 'CalculatorApp';
    }

    // Default template load
    loadTemplate('music');

    // 2. Build Pipeline Logic
    async function startBuild() {
      const appName = document.getElementById('appName').value.trim();
      const packageId = document.getElementById('packageId').value.trim();
      const htmlCode = document.getElementById('htmlInput').value.trim();
      const token = document.getElementById('ghToken').value.trim();

      if (!token) {
        alert('Please enter your GitHub Dispatch Token!');
        return;
      }
      if (!htmlCode) {
        alert('Please enter HTML Code or choose a template!');
        return;
      }

      const encodedHtml = btoa(unescape(encodeURIComponent(htmlCode)));
      const buildBtn = document.getElementById('buildBtn');
      const progressArea = document.getElementById('progressArea');
      const progressBar = document.getElementById('progressBar');
      const statusLabel = document.getElementById('statusLabel');
      const percentLabel = document.getElementById('percentLabel');
      const downloadContainer = document.getElementById('downloadContainer');
      const downloadLink = document.getElementById('downloadLink');

      buildBtn.disabled = true;
      buildBtn.classList.add('opacity-50');
      progressArea.classList.remove('hidden');
      downloadContainer.classList.add('hidden');
      progressBar.style.width = '10%';
      progressBar.style.background = '#0284c7';

      try {
        const triggerRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/build-apk.yml/dispatches`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            ref: 'main',
            inputs: {
              app_name: appName,
              package_id: packageId,
              html_content: encodedHtml
            }
          })
        });

        if (!triggerRes.ok) throw new Error('Could not trigger GitHub Action. Check token.');

        let sec = 0;
        let progress = 10;

        const poll = setInterval(async () => {
          sec += 5;
          if (progress < 90) progress += Math.floor(Math.random() * 4) + 3;
          progressBar.style.width = progress + '%';
          percentLabel.innerText = `${progress}% (${sec}s)`;

          try {
            const runRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/runs?per_page=1`, {
              headers: { 'Authorization': `Bearer ${token}` }
            });

            if (runRes.ok) {
              const runData = await runRes.json();
              const latestRun = runData.workflow_runs && runData.workflow_runs[0];

              if (latestRun && latestRun.status === 'completed') {
                if (latestRun.conclusion === 'success') {
                  const relRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                  });

                  if (relRes.ok) {
                    const releases = await relRes.json();
                    const latestRel = releases && releases[0];
                    const apkAsset = latestRel && latestRel.assets && latestRel.assets.find(a => a.name.endsWith('.apk'));

                    if (apkAsset) {
                      clearInterval(poll);
                      progressBar.style.width = '100%';
                      progressBar.style.background = '#10b981';
                      percentLabel.innerText = '100%';
                      statusLabel.innerText = '✅ Compilation 100% Succeeded!';
                      downloadLink.href = apkAsset.browser_download_url;
                      downloadContainer.classList.remove('hidden');
                      buildBtn.disabled = false;
                      buildBtn.classList.remove('opacity-50');
                      return;
                    }
                  }
                } else {
                  clearInterval(poll);
                  progressBar.style.width = '100%';
                  progressBar.style.background = '#ef4444';
                  statusLabel.innerText = '❌ Build Failed!';
                  buildBtn.disabled = false;
                  buildBtn.classList.remove('opacity-50');
                  return;
                }
              }
            }
          } catch (e) {
            console.error(e);
          }
        }, 5000);

      } catch (err) {
        alert(err.message);
        buildBtn.disabled = false;
        buildBtn.classList.remove('opacity-50');
      }
    }
  </script>
</body>
</html>
