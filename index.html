<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DroidForge — Universal Web to APK Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f17; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(22, 27, 34, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col items-center justify-center p-4 sm:p-6">

  <div class="w-full max-w-xl glass-card rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
    
    <!-- Header -->
    <div class="flex items-center gap-3 border-b border-gray-800 pb-4">
      <div class="w-12 h-12 rounded-2xl bg-sky-500/20 text-sky-400 flex items-center justify-center text-2xl font-bold">🚀</div>
      <div>
        <h1 class="text-xl font-black text-white">DroidForge <span class="text-sky-400">Builder</span></h1>
        <p class="text-xs text-gray-400">Convert Any Website / HTML to Real Android APK</p>
      </div>
    </div>

    <!-- Configuration Form -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">செயலியின் பெயர் (App Name) *</label>
        <input id="appName" type="text" value="My App" placeholder="உதா: Cinema Player" class="w-full bg-black/50 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-sky-400 outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">Package ID *</label>
        <input id="packageId" type="text" value="com.droidforge.app" placeholder="com.example.app" class="w-full bg-black/50 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-sky-400 outline-none font-mono text-xs">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">இணையதள முகவரி (Target URL) *</label>
        <input id="webUrl" type="url" value="https://google.com" placeholder="https://yourwebsite.com" class="w-full bg-black/50 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-sky-400 outline-none">
      </div>

      <!-- Action Button -->
      <button id="buildBtn" onclick="triggerBuild()" class="w-full bg-sky-500 hover:bg-sky-400 text-black font-extrabold py-3.5 rounded-xl transition shadow-lg text-sm flex items-center justify-center gap-2">
        <span>⚙️ Build Android APK</span>
      </button>
    </div>

    <!-- Status Box -->
    <div id="statusBox" class="hidden bg-gray-900/80 border border-gray-800 rounded-2xl p-4 space-y-3">
      <div class="flex items-center justify-between text-xs">
        <span id="statusText" class="text-sky-400 font-semibold flex items-center gap-2">
          <span class="animate-spin">⏳</span> பில்ட் தயாராகிறது...
        </span>
        <span id="percentText" class="text-gray-400 font-mono">தயாராகிறது...</span>
      </div>

      <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-sky-400 h-full w-1/4 transition-all duration-500"></div>
      </div>

      <div id="downloadContainer" class="hidden pt-2">
        <a id="downloadLink" href="#" target="_blank" class="w-full block text-center bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-2.5 rounded-xl text-xs transition">
          📥 நேரடி Actions பக்கத்தில் APK பதிவிறக்கம் செய்ய (Download)
        </a>
      </div>
    </div>

  </div>

  <script>
    function triggerBuild() {
      const appName = document.getElementById('appName').value.trim() || 'My App';
      const webUrl = document.getElementById('webUrl').value.trim();
      const statusBox = document.getElementById('statusBox');
      const downloadContainer = document.getElementById('downloadContainer');
      const downloadLink = document.getElementById('downloadLink');

      if (!webUrl) {
        alert("தயவுசெய்து சரியான இணையதள முகவரியை (URL) உள்ளிடவும்!");
        return;
      }

      statusBox.classList.remove('hidden');
      downloadContainer.classList.remove('hidden');
      
      // Actions page link
      downloadLink.href = "https://github.com/KAVIKING786/DroidForge-apk-builder/actions/workflows/build-apk.yml";
      downloadLink.innerText = "🚀 Actions பக்கத்திற்குச் சென்று 'Run workflow' அழுத்தி APK எடுக்க";
    }
  </script>
</body>
</html>
